name: Go

on:
  push:
    branches: [ "main" ]
    # Pushing a tag like v1.0.0 also publishes a release
    tags: [ "v*" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"

  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "README.md"
      - "LICENSE"

jobs:

  vet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'

    - name: Vet
      run: make vet

  build:
    needs: vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-amd64
          - linux-arm64
          - windows-amd64
          - windows-arm64
          - darwin-amd64
          - darwin-arm64
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.4'

    - name: Build
      run: make ${{ matrix.target }}

    - name: Package
      run: |
        cd dist
        name=justlive-${{ matrix.target }}
        if [ -f "$name.exe" ]; then
          zip "$name.zip" "$name.exe"
        else
          tar -czf "$name.tar.gz" "$name"
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: justlive-${{ matrix.target }}
        path: |
          dist/*.tar.gz
          dist/*.zip
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Changelog
      uses: orhun/git-cliff-action@v4
      with:
        config: cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: RELEASE_NOTES.md

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Checksums
      run: cd dist && sha256sum * > SHA256SUMS.txt

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        body_path: RELEASE_NOTES.md
